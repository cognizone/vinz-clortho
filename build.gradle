buildscript {
  ext {
    //only for artifacts the Spring Boot BOM does not manage (or where an explicit version is needed)
    commonsIoVersion = "2.22.0"
    jakartaInjectVersion = "2.0.1"
  }
}

plugins {
  id 'pl.allegro.tech.build.axion-release' version '1.21.4'
  id 'org.springframework.boot' version '4.1.1' apply false
  id 'io.spring.dependency-management' version '1.1.7'
  id 'idea'
  id 'java'
  id 'java-library'
  id 'maven-publish'
  id "io.freefair.lombok" version "8.14.4"
}

repositories {
  mavenLocal()
  mavenCentral()
}

scmVersion {
  tag {
    prefix = "v"
    versionSeparator = ""
    branchPrefix = [
            'release/.*': 'release-v',
            'hotfix/.*' : 'hotfix-v'
    ]
  }
  nextVersion {
    suffix = "SNAPSHOT"
    separator = "-"
  }
}

idea {
  project {
    jdkName = "21"
    languageLevel = "21"
  }
}

subprojects {
  apply plugin: 'java'
  apply plugin: 'idea'
  apply plugin: "io.freefair.lombok"
  apply plugin: 'io.spring.dependency-management'
  apply plugin: "maven-publish"
  apply plugin: 'signing'

  group = 'zone.cogni.lib.vinz-clortho'
  project.version = scmVersion.version

  repositories {
    if (project.hasProperty('jenkins-ci')) {
      maven {
        url "${System.properties['nexus.url']}/repository/cognizone-group"
        credentials {
          username = System.properties['nexus.username']
          password = System.properties['nexus.password']
        }
        allowInsecureProtocol(true)
      }
    }
    mavenLocal()
    mavenCentral()
    maven { url "https://s01.oss.sonatype.org/content/repositories/snapshots/" }
    maven { url "https://repo.spring.io/milestone" }
  }

  dependencyManagement {
    imports {
      mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
    }
    //commons-lang3, jakarta.inject, httpclient5, JUnit, AssertJ and Mockito are managed by the Spring Boot BOM
    dependencies {
      dependency("commons-io:commons-io:${commonsIoVersion}")
    }
  }

  dependencies {
    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'
  }

  jar {
    from("${projectDir}") {
      include 'LICENSE'
      into '/'
    }
    from("${projectDir}") {
      include 'LICENSE'
      into 'META-INF'
    }
  }

  java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withJavadocJar()
    withSourcesJar()
  }

  tasks.named('test') {
    useJUnitPlatform()
  }

  publishing {
    publications {
      mavenJava(MavenPublication) {
        groupId = group
        version = scmVersion.version
        from components.java
        pom {
          name = "${project.name}"
          packaging = 'jar'
          // optionally artifactId can be defined here
          description = 'A lightweight replacement for Zuul when using spring boot 2.7+'
          url = 'https://github.com/cognizone/vinz-clortho'

          scm {
            connection = 'scm:git:git@https://github.com/cognizone/vinz-clortho.git'
            developerConnection = 'scm:git:git@github.com:cognizone/vinz-clortho.git'
            url = 'https://github.com/cognizone/vinz-clortho'
          }

          licenses {
            license {
              name = 'The Apache License, Version 2.0'
              url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
          }

          developers {
            developer {
              id = 'cognizone'
              name = 'Cognizone'
              email = 'cognizone-lib-dev@cogni.zone'
            }
          }
        }
      }
    }
    repositories {
      if (project.hasProperty("publishToCognizoneNexus")) {
        maven {
          credentials {
            username = System.properties['nexus.username']
            password = System.properties['nexus.password']
          }
          def releasesRepoUrl = "${System.properties['nexus.url']}/repository/cognizone-release"
          def snapshotsRepoUrl = "${System.properties['nexus.url']}/repository/cognizone-snapshot"
          url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
          allowInsecureProtocol(true)
        }
      }
      if (project.hasProperty("publishToMavenCentral")) {
        maven {
          credentials {
            username = System.properties['ossrh.username']
            password = System.properties['ossrh.password']
          }
          // We cannot directly release to Maven Central, we first need to publish on staging repo
          // then manually release through the UI in https://s01.oss.sonatype.org/ (login with JIRA)
          def stagingRepoUrl = "${System.properties['ossrh.url']}/service/local/staging/deploy/maven2"
          def snapshotsRepoUrl = "${System.properties['ossrh.url']}/content/repositories/snapshots"
          url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : stagingRepoUrl
        }
      }

    }
  }
  signing {
    if (project.hasProperty("signArtifacts")) {
      sign publishing.publications.mavenJava
    }
  }

  tasks.withType(Javadoc) {
    failOnError false
  }
}

project("vinz-clortho") {
  dependencies {
    implementation("jakarta.inject:jakarta.inject-api:${jakartaInjectVersion}") //needed for the jakarta.inject.Named copyable annotation (lombok.config) and to keep main consistent with the tests; the explicit version also keeps the publication valid (module metadata rejects a publication whose dependencies are all versionless)

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation "commons-io:commons-io"
    implementation "org.apache.commons:commons-lang3"
    implementation "org.apache.httpcomponents.client5:httpclient5"

    //test
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.springframework.boot:spring-boot-webmvc-test")
    testImplementation("jakarta.inject:jakarta.inject-api")
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("org.assertj:assertj-core")
    testImplementation("org.mockito:mockito-junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
  }
}
